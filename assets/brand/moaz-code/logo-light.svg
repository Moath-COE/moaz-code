<style>
.mc-d, .mc-e, .mc-rock { transform-box: view-box; transform-origin: 0 0; }
.mc-d { animation: mc-fall 2.8s 0.5s both; }

@keyframes mc-fall {
  0%, 18% { transform: translate(-12.22px, -48.99px) rotate(-22.00deg); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
  23% { transform: translate(-14.47px, -54.55px) rotate(-28.00deg); }
  29% { transform: translate(-12.22px, -48.99px) rotate(-18.00deg); }
  34% { transform: translate(-12.22px, -48.99px) rotate(-22.00deg); animation-timing-function: cubic-bezier(.55,0,.9,.45); }
  58% { transform: translate(1.12px, 2.78px) rotate(6.00deg); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
  66% { transform: translate(-2.25px, -5.56px) rotate(-4.00deg); animation-timing-function: cubic-bezier(.55,0,.9,.45); }
  74% { transform: translate(0.37px, 0.93px) rotate(1.00deg); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
  82%, 100% { transform: translate(0.00px, 0.00px) rotate(0.00deg); }
}
.mc-dfill { animation: mc-dfill 2.8s 0.5s both; }
@keyframes mc-dfill { 0%, 20% { fill: #0e1528; } 40%, 100% { fill: #b08a45; } }
.mc-e { animation: mc-close 2.8s 0.5s both; }
@keyframes mc-close {
  0%, 60% { transform: translateX(16.04px); animation-timing-function: cubic-bezier(.5,0,.3,1); }
  76% { transform: translateX(-2.50px); }
  86%, 100% { transform: translateX(0px); }
}
.mc-streaks { animation: mc-streaks 2.8s 0.5s both; }
@keyframes mc-streaks {
  0%, 38% { opacity: 0; transform: translateY(-25.00px); }
  50% { opacity: 0.6; }
  64%, 100% { opacity: 0; transform: translateY(0px); }
}
.mc-rock { transform-origin: 0px 30.00px; animation: mc-rock 5s 2.80s ease-in-out infinite; }
@keyframes mc-rock { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-2.5deg); } }
.mc-caret-in { animation: mc-caret-in 3.00s both; }
@keyframes mc-caret-in { 0%, 99% { opacity: 0; } 100% { opacity: 1; } }
.mc-blink { animation: mc-blink 1.1s 3.00s steps(1) infinite; }
@keyframes mc-blink { 0% { opacity: 1; } 55% { opacity: 0; } }
.mc-spark { transform-box: fill-box; transform-origin: center; animation: mc-twinkle 2.6s ease-in-out infinite; }
.mc-spark0 { animation-delay: 2.80s; } .mc-spark1 { animation-delay: 3.70s; } .mc-spark2 { animation-delay: 4.40s; }
@keyframes mc-twinkle { 0%, 100% { opacity: 0.9; transform: scale(1) rotate(0deg); } 50% { opacity: 0.25; transform: scale(0.55) rotate(45deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
